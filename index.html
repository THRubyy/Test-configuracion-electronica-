<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test de configuración electrónica</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:20px;background:#f3f4f6;
  font-family:Arial,sans-serif;color:#222;
}
.card{
  max-width:720px;margin:20px auto;background:white;padding:28px;
  border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.10)
}
h1{text-align:center;margin-top:0}
.counter{text-align:center;color:#666;margin-bottom:12px}
.progress{height:10px;background:#e5e7eb;border-radius:10px;overflow:hidden;margin-bottom:25px}
.progress-bar{height:100%;width:0;background:#2563eb;transition:.25s}
.atomic{
  text-align:center;font-size:30px;font-weight:bold;margin:20px 0 28px
}
label{display:block;font-weight:bold;margin:15px 0 7px}
input{
  width:100%;padding:12px;border:1px solid #bbb;border-radius:9px;
  font-size:17px;outline:none
}
input:focus{border-color:#2563eb}
.mode-buttons{display:flex;gap:8px;margin-bottom:8px}
.mode-buttons button{
  flex:1;padding:9px;border:1px solid #bbb;background:#f8f8f8;
  border-radius:8px;cursor:pointer;font-size:15px
}
.mode-buttons button.active{background:#2563eb;color:white;border-color:#2563eb}
.config-input{font-family:"Times New Roman",serif}
button.check{
  width:100%;padding:14px;margin-top:24px;border:0;border-radius:10px;
  background:#2563eb;color:white;font-size:17px;font-weight:bold;cursor:pointer
}
button.check:hover{background:#1d4ed8}
.feedback{margin-top:18px;padding:12px;border-radius:9px;display:none}
.ok{background:#dcfce7;color:#166534}
.bad{background:#fee2e2;color:#991b1b}
.score{text-align:center;font-size:22px;font-weight:bold}
.hint{font-size:13px;color:#666;margin-top:5px}
.hidden{display:none}
</style>
</head>
<body>
<div class="card">
  <h1>Test de configuración electrónica</h1>
  <div class="counter" id="counter"></div>
  <div class="progress"><div class="progress-bar" id="progress"></div></div>

  <div class="atomic" id="atomic"></div>

  <label>Configuración electrónica</label>
  <input id="config" class="config-input" autocomplete="off"
         placeholder="Ej.: 1s2 2s2 2p6">

  <label>Configuración electrónica de la capa de valencia</label>
  <input id="valence" autocomplete="off"
         placeholder="Ej.: 3s2 3p5">

  <label>Valencia iónica</label>
  <input id="ionic" type="text" autocomplete="off"
         placeholder="Ej.: +2, -1, +3">

  <label>Grupo</label>
  <input id="group" type="text" inputmode="numeric" autocomplete="off">

  <label>Período</label>
  <input id="period" type="text" inputmode="numeric" autocomplete="off">

  <label>n</label>
  <input id="n" type="text" inputmode="numeric" autocomplete="off">

  <label>l</label>
  <input id="l" type="text" inputmode="numeric" autocomplete="off">

  <label>mₗ</label>
  <input id="ml" type="text" inputmode="numeric" autocomplete="off">

  <label>nº spin</label>
  <input id="spin" type="text" autocomplete="off"
         placeholder="Ej.: +1/2 o −1/2">

  <button class="check" id="check">Comprobar</button>
  <div id="feedback" class="feedback"></div>
</div>

<script>
const elements = [

[6,"C","1s2 2s2 2p2","2s2 2p2",14,2,1,-1,"+1/2",["-4","+2","+4"]],
[7,"N","1s2 2s2 2p3","2s2 2p3",15,2,1,-1,"+1/2",["-3","+3","+5"]],

[16,"S","1s2 2s2 2p6 3s2 3p4","3s2 3p4",16,3,1,-1,"+1/2",["-2","+2","+4","+6"]],
[17,"Cl","1s2 2s2 2p6 3s2 3p5","3s2 3p5",17,3,1,-1,"+1/2",["-1","+1","+3","+5","+7"]],
[18,"Ar","1s2 2s2 2p6 3s2 3p6","3s2 3p6",18,3,1,-1,"+1/2",[]],
[19,"K","1s2 2s2 2p6 3s2 3p6 4s1","4s1",1,4,0,0,"+1/2",["+1"]],
[20,"Ca","1s2 2s2 2p6 3s2 3p6 4s2","4s2",2,4,0,0,"+1/2",["+2"]],
[21,"Sc","1s2 2s2 2p6 3s2 3p6 4s2 3d1","4s2",3,4,2,-2,"+1/2",["+2","+3"]],
[22,"Ti","1s2 2s2 2p6 3s2 3p6 4s2 3d2","4s2",4,4,2,-2,"+1/2",["+2","+3","+4"]],
[23,"V","1s2 2s2 2p6 3s2 3p6 4s2 3d3","4s2",5,4,2,-2,"+1/2",["+2","+3","+4","+5"]],
[24,"Cr","1s2 2s2 2p6 3s2 3p6 4s1 3d5","4s1",6,4,2,-2,"+1/2",["+2","+3","+6"]],

[29,"Cu","1s2 2s2 2p6 3s2 3p6 4s1 3d10","4s1",11,4,2,-2,"+1/2",["+1","+2"]],

[36,"Kr","1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6","4s2 4p6",18,4,1,-1,"+1/2",[]],

[40,"Zr","1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s2 4d2","5s2",4,5,2,-2,"+1/2",["+4"]],
[41,"Nb","1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s1 4d4","5s1",5,5,2,-2,"+1/2",["+3","+5"]],
[42,"Mo","1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s1 4d5","5s1",6,5,2,-2,"+1/2",["+2","+3","+4","+5","+6"]],
[43,"Tc","1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s2 4d5","5s2",7,5,2,-2,"+1/2",["+4","+7"]],
[44,"Ru","1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s1 4d7","5s1",8,5,2,-2,"+1/2",["+2","+3","+4","+6","+8"]],
[45,"Rh","1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s1 4d8","5s1",9,5,2,-2,"+1/2",["+1","+3"]],
[46,"Pd","1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 4d10","4d10",10,5,2,-2,"+1/2",["+2","+4"]],
[47,"Ag","1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s1 4d10","5s1",11,5,2,-2,"+1/2",["+1"]],
[48,"Cd","1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s2 4d10","5s2",12,5,2,-2,"+1/2",["+2"]],
[49,"In","1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s2 4d10 5p1","5s2 5p1",13,5,1,-1,"+1/2",["+3"]],
[50,"Sn","1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s2 4d10 5p2","5s2 5p2",14,5,1,-1,"+1/2",["+2","+4"]]
];

let questions=[], index=0, score=0, mode="normal";
const supers = {"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function normalize(s){
  return s.toLowerCase().replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g,
    c=>Object.keys(supers).find(k=>supers[k]===c))
    .replace(/\s+/g,"").replace(/−/g,"-");
}
function toSuperscript(s){
  return s.replace(/\d+/g, m=>[...m].map(x=>supers[x]).join(""));
}
function clearInputs(){
  ["config","valence","group","period","n","l","ml","spin"].forEach(id=>document.getElementById(id).value="");
}
function showQuestion(){
  const q=questions[index];
  document.getElementById("counter").textContent=`Pregunta ${index+1} de ${questions.length}`;
  document.getElementById("progress").style.width=((index/questions.length)*100)+"%";
  document.getElementById("atomic").textContent=`Z = ${q[0]}`;
  document.getElementById("feedback").style.display="none";
  clearInputs();
}
function sameConfig(user, correct){
  return normalize(user)===normalize(correct);
}
function check(){
  const q=questions[index];
  const vals={
    config:document.getElementById("config").value,
    valence:document.getElementById("valence").value,
    ionic:document.getElementById("ionic").value.trim().replace("−","-"),
    group:document.getElementById("group").value.trim(),
    period:document.getElementById("period").value.trim(),
    n:document.getElementById("n").value.trim(),
    l:document.getElementById("l").value.trim(),
    ml:document.getElementById("ml").value.trim(),
    spin:document.getElementById("spin").value.trim().replace("−","-")
  };
  const correct=[
    sameConfig(vals.config,q[2]),
    sameConfig(vals.valence,q[3]),
    q[9].length===0 ? (vals.ionic==="" || vals.ionic==="—") : q[9].includes(vals.ionic),
    vals.group==q[4],
    vals.period==q[5],
    vals.n==q[5],
    vals.l==q[6],
    Number.isInteger(Number(vals.ml)) && Number(vals.ml)>=-Number(vals.l) && Number(vals.ml)<=Number(vals.l),
    /^[-+]?1\s*\/\s*2$/.test(vals.spin)
  ];
  const ok=correct.every(Boolean);
  const fb=document.getElementById("feedback");
  if(ok){
    score++;
    fb.className="feedback ok";
    fb.innerHTML="<strong>✓ Correcto.</strong> Todos los apartados están bien.";
  }else{
    fb.className="feedback bad";
    fb.innerHTML=`<strong>✗ Hay algún error.</strong><br>
    Configuración: ${q[2]}<br>
    Capa de valencia: ${q[3]}<br>
    Valencia iónica: ${q[9].length ? q[9].join(", ") : "sin valencia iónica habitual"}<br>
    Grupo: ${q[4]} · Período: ${q[5]}<br>
    n = ${q[5]} · l = ${q[6]} · mₗ = ${q[7]} · nº spin = ${q[8]}`;
  }
  fb.style.display="block";
  document.getElementById("check").textContent =
    index===questions.length-1 ? "Ver resultado" : "Siguiente";
  document.getElementById("check").onclick=next;
}
function next(){
  index++;
  if(index>=questions.length){
    document.querySelector(".card").innerHTML=`
      <h1>Test terminado</h1>
      <div class="score">Puntuación: ${score} / ${questions.length}</div>
      <button class="check" onclick="location.reload()">Repetir test (nuevo orden)</button>`;
    return;
  }
  document.getElementById("check").textContent="Comprobar";
  document.getElementById("check").onclick=check;
  showQuestion();
}

document.getElementById("check").onclick=check;

questions=shuffle([...elements]);
showQuestion();
</script>
</body>
</html>
